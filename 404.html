<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Stackly</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to Stackly.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--color-cream); font-family: var(--font-primary); }
    .not-found-page {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 520px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .nf-code {
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #E63946 0%, #F4A261 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: -4px;
    }
    .nf-icon {
      font-size: 3.5rem;
      margin-bottom: 0.5rem;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    .nf-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--color-black);
      font-family: 'Playfair Display', serif;
      margin: 0;
    }
    .nf-sub {
      font-size: 0.95rem;
      color: var(--color-gray-500);
      line-height: 1.7;
      max-width: 380px;
      margin: 0 auto;
    }
    .nf-tag {
      display: inline-block;
      background: rgba(230,57,70,0.10);
      color: var(--color-primary);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .nf-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }
    .nf-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      border: none;
    }
    .nf-btn-primary {
      background: linear-gradient(135deg, #E63946 0%, #F4A261 100%);
      color: #fff;
      box-shadow: 0 8px 30px rgba(230,57,70,0.3);
    }
    .nf-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(230,57,70,0.4); }
    .nf-btn-outline {
      background: transparent;
      color: var(--color-gray-700);
      border: 2px solid var(--color-gray-200);
    }
    .nf-btn-outline:hover { background: var(--color-gray-100); border-color: var(--color-gray-300); transform: translateY(-2px); }
    .nf-divider {
      width: 60px; height: 3px;
      background: linear-gradient(135deg, #E63946, #F4A261);
      border-radius: 2px;
    }
    .nf-quote {
      font-size: 0.9rem;
      color: var(--color-gray-500);
      font-style: italic;
      border-left: 3px solid var(--color-primary);
      padding-left: 1rem;
      text-align: left;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="not-found-page">
    <span class="nf-tag">Error 404</span>
    <div class="nf-icon"><i class="fas fa-utensils" style="color: var(--color-primary);"></i></div>
    <div class="nf-code">404</div>
    <h1 class="nf-title">This dish isn't on the menu!</h1>
    <div class="nf-divider"></div>
    <p class="nf-sub">
      Looks like this page has gone off the menu. It may have been moved, removed, or perhaps it was never cooked up in the first place.
    </p>
    <blockquote class="nf-quote">
      "Every great restaurant knows what it doesn't serve — and we don't serve this page."
    </blockquote>
    <div class="nf-actions">
      <a href="login.html" class="nf-btn nf-btn-primary">
        <i class="fas fa-home"></i> Back to Login
      </a>
      <a href="index.html" class="nf-btn nf-btn-outline">
        <i class="fas fa-arrow-left"></i> Previous Page
      </a>
    </div>
  </div>
</body>
</html>
